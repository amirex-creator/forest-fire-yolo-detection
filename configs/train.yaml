# ============================================================================
# 训练超参数 —— 单一来源，train.py（阶段六）与 evaluate.py（阶段八）共用
# ============================================================================
# 依据：docs/compatibility_final.md 第四节（6 GB 显存 + 低可用内存的保守配置）
# 约束：RTX 3060 Laptop 6GB / 内存 15.6GB（检查时可用仅 2.62GB）
# 说明：路径一律相对项目根，由 src/paths.py 解析，禁止写死盘符。
# ----------------------------------------------------------------------------

# ---------- 模型 ----------
model: yolov8n.pt          # 预训练权重名；首次使用会从 GitHub 下载（阶段四已经核实可访问）
pretrained: true           # 迁移学习：加载预训练权重，不从零训练

# ---------- 数据 ----------
data: configs/forest_smoke.yaml   # 数据集配置（nc=2, names=[smoke, fire]）

# ---------- 训练规模 ----------
epochs: 50                 # 正式训练轮数（阶段六先跑 smoke_test 验证流程，用户确认后才跑这个）
imgsz: 640                 # 输入尺寸；显存不足时降到 512
batch: 8                   # OOM 时 8 -> 4 -> 2
workers: 2                 # Windows 多进程开销大，且可用内存有限；卡死时降到 0
patience: 30               # 早停耐心值
seed: 0                    # 固定随机种子，保证可复现
deterministic: true

# ---------- 精度与显存 ----------
amp: true                  # 混合精度：省显存并提速（Ampere 支持良好）
cache: false               # 严禁改 true：会把数据集读进内存，当前可用内存不足

# ---------- 设备 ----------
# 0 = 第一块 GPU；若阶段四验证 CUDA 不可用，改为 cpu（会慢很多）
device: 0

# ---------- 输出位置（相对项目根）----------
project: outputs/train_runs
name: baseline             # 每次实验换名字，脚本不会自动删除旧目录
exist_ok: false            # 同名目录已存在时报错，避免覆盖历史实验

# ============================================================================
# 小规模试跑参数（阶段六第一步，用于验证流程与测真实耗时）
# 用法：train.py --smoke-test 时，用下列值覆盖上面的 epochs/batch/imgsz
# 严禁跳过试跑直接执行正式长训练
# ============================================================================
smoke_test:
  epochs: 2
  batch: 8
  imgsz: 640
  # 试跑用【分层抽样】的图片清单（train.py 生成 trial_train.txt），不用 fraction。
  # 原因：Ultralytics 的 fraction 取的是按文件名排序后的前 N 张，本项目文件名已重编号，
  # 前 1507 张里有 1502 张是空标签负样本，用它试跑会得到“模型只学会预测空白”的假象。
  max_images: 3000
  fraction: 1.0            # 抽样由清单负责，fraction 必须保持 1.0
